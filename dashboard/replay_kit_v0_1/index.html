<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RDR2 Field Desk — Screenshot Replay</title>
<style>
:root{color-scheme:dark;--canvas:#090b0c;--desk:#111315;--white:#e8e9eb;--outline:#34383d;--divider:#222529;--gold:#d6ac49;--silver:#c2c9d1;--bronze:#c28a60;--pending:#454a52;--risk:#e45b58}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--canvas);color:var(--white);font-family:Arial,Helvetica,sans-serif}button{font:inherit;color:inherit}
main{width:min(576px,calc(100% - 4px));min-height:436px;margin:0 0 0 4px;background:var(--desk);border-radius:13px;padding:5px 10px 9px;box-shadow:0 0 0 1px rgba(255,255,255,.025)}
.header{display:flex;align-items:center;gap:10px}.emblem{font-size:14px;margin:10px 0 0 0}.header-text{flex:1}.brand{font-size:8px;font-weight:700;line-height:11px;color:#ddd}.place{font-size:14px;line-height:17px;font-weight:700;margin-top:2px}.chapter{font-size:11px;line-height:16px;margin-top:2px;color:#c6c8c9}
.home{align-self:flex-start;margin-top:14px;border:1px solid #383b40;border-radius:14px;padding:3px 11px;background:transparent;font-size:11px;white-space:nowrap;cursor:pointer}.home:hover{background:#1f2225}
.summary{display:flex;gap:8px;align-items:baseline;margin-top:10px;min-height:23px;white-space:nowrap}.summary strong{font-size:14px;color:var(--gold)}.summary .silver,.summary .bronze{font-size:11px;font-weight:500}.summary .bronze{color:var(--bronze)}.count{margin-left:auto;color:#d5d6d7;font-size:10px}
.rail{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:3px;margin-top:6px}.segment{height:15px;border:0;padding:0;background:none;cursor:pointer;position:relative;min-width:0}.segment::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--stripe);border-radius:1px}.segment[data-marker="true"]::after{content:'';position:absolute;left:50%;top:7px;transform:translateX(-50%);width:4px;height:4px;background:#f9fafb;border-radius:50%}.segment:focus-visible{outline:1px solid white;outline-offset:2px}
.top-divider{border:0;border-top:1px solid #1f2125;margin:18px 0 17px}.mission-heading{display:flex;justify-content:space-between;align-items:center}.mission-heading h1{font-size:14px;margin:0;line-height:19px}.mission-heading .book{font-size:14px;color:#bfc1c4}.subheading{font-size:11px;line-height:16px;margin:2px 0 9px;color:#cbd0d3}
.mission-list{border:1px solid #383d42;border-radius:7px;overflow:hidden}.mission{width:100%;text-align:left;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;border:0;background:transparent;cursor:pointer;padding:15px 12px 12px}.mission:hover{background:#1a1d20}.mission:not(:last-child){border-bottom:1px solid #202326}.mission:first-child{min-height:87px}.mission:nth-child(2){min-height:64px}.mission:last-child{min-height:85px}.mission-content{display:flex;flex-direction:column;gap:5px;min-width:0}.mission-title{font-size:12px;line-height:14px;font-weight:700}.giver{font-size:10px;line-height:12px;color:#d2d3d5}.detail{font-size:10px;line-height:14px;color:#c9cbcd;margin-top:3px}.detail b{font-size:8px;font-weight:800;color:#e5e6e7}.detail .star{color:var(--gold)}.risk{font-size:10px;line-height:12px;color:var(--risk)}.chevron{font-size:19px;line-height:18px;margin:7px 2px 0 0;color:#dde0e2}
.notice{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#20252b;border:1px solid #555c63;border-radius:9px;padding:10px 14px;font-size:12px;max-width:min(94vw,480px);display:none;text-align:center}.notice[open]{display:block}
@media(max-width:430px){main{width:100%;margin:0;border-radius:0}.header{gap:7px}.summary{gap:5px}.summary strong{font-size:12px}.summary .silver,.summary .bronze,.count{font-size:9px}}
</style></head><body>
<main aria-label="RDR2 Field Desk screenshot simulation">
 <div class="header">
  <div class="emblem" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m14.8 9.2-1.9 3.7-3.7 1.9 1.9-3.7z"/></svg></div>
  <div class="header-text"><div class="brand">RDR2 / FIELD DESK</div><div class="place">Horseshoe Overlook</div><div class="chapter">Chapter II</div></div>
  <button class="home" onclick="message('Home navigation is not wired to real GameGuide context in this visual fixture.')"><svg style="vertical-align:-2px" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 3l9 7v10h-7v-6h-4v6H3z"/></svg> Home</button>
 </div>
 <div class="summary"><strong>6 Gold</strong><span class="silver">2 Silver</span><span class="bronze">1 Bronze</span><span class="count">9 / 18 recorded</span></div>
 <div class="rail" aria-label="18 mission medals (screenshot simulation)" id="rail"></div>
 <hr class="top-divider">
 <div class="mission-heading"><h1>Mission Control</h1><span class="book" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6a8 8 0 0 0-9-2v15a8 8 0 0 1 9 2c3-2 6-3 9-2V4a8 8 0 0 0-9 2z"/><path d="M12 6v15"/></svg></span></div>
 <p class="subheading">3 available markers · Simulation</p>
 <section class="mission-list" aria-label="Three simulated available mission markers">
  <button class="mission" onclick="message('Reference mission: The Spines of America. Actual source-read requires GameGuide.')"><span class="mission-content"><span class="mission-title">The Spines of America</span><span class="giver">Hosea</span><span class="detail"><span class="star">✦</span> <b>NEW POSSIBILITIES</b> · Emerald Ranch wagon Fence</span></span><span class="chevron">›</span></button>
  <button class="mission" onclick="message('Reference mission: Pouring Forth Oil — II. Time-sensitive window needs source verification.')"><span class="mission-content"><span class="mission-title">Pouring Forth Oil — II</span><span class="giver">John <span class="risk">◷ Time-sensitive</span></span></span><span class="chevron">›</span></button>
  <button class="mission" onclick="message('Reference mission: A Fisher of Men. Actual source-read requires GameGuide.')"><span class="mission-content"><span class="mission-title">A Fisher of Men</span><span class="giver">Abigail</span><span class="detail"><span class="star">✦</span> <b>NEW POSSIBILITIES</b> · Fishing</span></span><span class="chevron">›</span></button>
 </section>
</main><div class="notice" id="notice" role="status"></div>
<script>
const fixture={medals:['gold','gold','gold','silver','gold','bronze','unknown','gold','silver','gold','unknown','unknown','unknown','unknown','unknown','unknown','unknown','unknown'],dots:[6,10,11]};
const colors={gold:'#d6ac49',silver:'#c2c9d1',bronze:'#c28a60',unknown:'#454a52'};
const rail=document.getElementById('rail');fixture.medals.forEach((medal,i)=>{let btn=document.createElement('button');btn.className='segment';btn.type='button';btn.style.setProperty('--stripe',colors[medal]);btn.dataset.marker=String(fixture.dots.includes(i));btn.setAttribute('aria-label','Reference slot '+(i+1)+': '+medal+'; '+(fixture.dots.includes(i)?'illustrative map marker':'no marker shown'));btn.title='Slot '+(i+1)+' — '+medal+' (simulation; mission title needs canonical source mapping)';btn.onclick=()=>message(btn.title);rail.append(btn)});
let hide;function message(t){const box=document.getElementById('notice');box.textContent=t;box.setAttribute('open','');clearTimeout(hide);hide=setTimeout(()=>box.removeAttribute('open'),3500)}
</script></body></html>
